name: CI
on:
  merge_group: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  code-quality: write
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ⚙️ Setup
        uses: w5s/actions/setup@9f9044bf1436fbf25f5e5da54b15cc1cef268a63 # main
      - name: 🔨 Build
        uses: w5s/actions/task@9f9044bf1436fbf25f5e5da54b15cc1cef268a63 # main
        with:
          task: build
      - name: 🔍 Validate
        uses: w5s/actions/task@9f9044bf1436fbf25f5e5da54b15cc1cef268a63 # main
        with:
          task: validate
